name: Run Tests

on:
  pull_request:
  push:
    branches:
      - main

# Kill other jobs when we trigger this workflow by sending new commits
# to the PR.
# https://stackoverflow.com/a/72408109
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore SafetyFirst.sln
      - name: Build with dotnet
        run: dotnet build SafetyFirst.sln -c Release --no-restore
      - name: Check llms.txt is up to date
        run: |
          dotnet fsi generate-llms.fsx
          git diff --exit-code llms.txt || { echo "::error::llms.txt is stale. Build, run 'dotnet fsi generate-llms.fsx' and commit the result."; exit 1; }
      - name: Test with dotnet
        run: dotnet test SafetyFirst.sln -f net10.0 -c Release --no-build
      - name: Pack and test package
        shell: pwsh
        run: ./test-package.ps1
